<p>Restores song recognition in Shazam 5.5.1 on iOS 6.</p>
<p>Install Shazam 5.5.1 before installing this tweak.</p>
<p>Turn the tweak on or off in Settings &gt; ShazamX.</p>
<p>Tested on iPhone 4S running iOS 6.1.3. Other iOS 6 devices may work.</p>
